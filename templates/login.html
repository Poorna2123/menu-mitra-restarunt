<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        /* ---------- Global Page Styling ---------- */
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ---------- Login Card ---------- */
        .login-card {
            background: #ffffff;
            width: 380px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0px 5px 30px rgba(0,0,0,0.15);
            text-align: center;
            animation: fadeIn 0.7s ease-in-out;
        }

        /* ---------- Animation ---------- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Headings ---------- */
        h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 26px;
        }

        p {
            color: #666;
            font-size: 14px;
        }

        /* ---------- Input Styling ---------- */
        input {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #aaa;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #00b09b;
            box-shadow: 0 0 6px rgba(0,176,155,0.4);
        }

        /* ---------- Login Button ---------- */
        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: #00b09b;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #028f7f;
        }

        /* ---------- Links ---------- */
        a {
            color: #028f7f;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Login to continue</p>

        <form method="POST">
            <input type="text" name="username" placeholder="Enter Username" required>
            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>

        <p style="margin-top: 15px;">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Signup</a>
        </p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Order Details</title>

    <!-- ---------- EMBEDDED PROFESSIONAL CSS ---------- -->
    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        /* ---------- HEADER ---------- */
        h2 {
            text-align: center;
            margin-top: 25px;
            font-size: 32px;
            font-weight: bold;
            color: #444;
        }

        /* ---------- MAIN CONTAINER ---------- */
        .container {
            width: 70%;
            background: white;
            margin: 30px auto;
            padding: 25px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        /* ---------- SECTION HEADINGS ---------- */
        h3 {
            font-size: 22px;
            color: #ff7e5f;
            margin-bottom: 10px;
            text-align: left;
        }

        /* ---------- TABLE STYLE ---------- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }

        table th {
            background: #ff7e5f;
            color: white;
            padding: 12px;
            font-size: 18px;
        }

        table td {
            padding: 12px;
            text-align: center;
            font-size: 16px;
            color: #444;
            border-bottom: 1px solid #ddd;
        }

        table tr:hover {
            background-color: #fff5f0;
        }

        /* ---------- INPUT FIELDS ---------- */
        .input-box {
            margin-bottom: 20px;
        }

        label {
            font-size: 18px;
            font-weight: 500;
            color: #333;
        }

        input {
            width: 96%;
            padding: 12px;
            margin-top: 6px;
            font-size: 17px;
            border-radius: 8px;
            border: 1px solid #bbb;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #ff7e5f;
            box-shadow: 0 0 6px rgba(255, 126, 95, 0.5);
        }

        /* ---------- BUTTON ---------- */
        .submit-btn {
            background: #ff7e5f;
            color: white;
            padding: 12px 35px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            display: block;
            margin: 30px auto 0;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #ff5733;
            transform: scale(1.07);
        }

        /* ---------- BACK LINK ---------- */
        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #444;
            font-size: 18px;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            color: #ff5733;
        }
    </style>
</head>

<body>

<h2>🧾 Order Details</h2>

<div class="container">

    <form action="{{ url_for('order') }}" method="POST">

        <!-- ---------- SELECTED ITEMS TABLE ---------- -->
        <h3>Selected Items</h3>

        <table>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
            </tr>

            {% for item in selected_items %}
            <tr>
                <td>
                    <input type="hidden" name="item" value="{{ item }}">
                    {{ item }}
                </td>

                <td>
                    <input type="number" name="quantity" value="1" min="1" style="width: 80px;">
                </td>
            </tr>
            {% endfor %}
        </table>

        <!-- ---------- TABLE DETAILS ---------- -->
        <h3>Table Information</h3>

        <div class="input-box">
            <label>Table Number</label>
            <input type="text" name="table_no" placeholder="Enter table number" required>
        </div>

        <div class="input-box">
            <label>Number of People</label>
            <input type="number" name="num_people" placeholder="How many people?" required>
        </div>

        <button type="submit" class="submit-btn">Confirm Order</button>

    </form>
</div>

<!-- BACK LINK -->
<div class="back">
    <a href="{{ url_for('home') }}">← Back to Menu</a>
</div>

</body>
</html>
